# Serves the proton2maildir Maildir at $PROTON_MAILDIR (an absolute path) the way Proton Mail Bridge shows the mailbox over IMAP. Needs Dovecot 2.4 or newer.
dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

# No Dovecot daemon runs, so there is no stats service to report to.
stats_writer_socket_path =

import_environment {
  PROTON_MAILDIR = %{env:PROTON_MAILDIR}
}
mail_driver = maildir
mail_path = %{env:PROTON_MAILDIR}
mail_inbox_path = %{env:PROTON_MAILDIR}/INBOX
mailbox_list_layout = fs
mailbox_list_utf8 = yes

# Serve Proton's flags only, without Dovecot's $HasAttachment/$HasNoAttachment keywords.
mail_attachment_detection_options =

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
  }
  mailbox Sent {
    special_use = \Sent
  }
  mailbox Archive {
    special_use = \Archive
  }
  mailbox Trash {
    special_use = \Trash
  }
  mailbox Spam {
    special_use = \Junk
  }
}
