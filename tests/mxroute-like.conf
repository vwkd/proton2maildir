# A local stand-in for MXroute's Dovecot, for the imapsync example to copy into: Maildir++ layout, empty namespace prefix, "." between folder levels, and MXroute's special-use folders. Dovecot's default settings stay as they are (so uploads get $HasAttachment/$HasNoAttachment keywords, as on Dovecot 2.4 servers). The Maildir is at $TARGET_MAILDIR.
dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0
stats_writer_socket_path =

import_environment {
  TARGET_MAILDIR = %{env:TARGET_MAILDIR}
}
mail_driver = maildir
mail_path = %{env:TARGET_MAILDIR}
mailbox_list_layout = maildir++

namespace inbox {
  inbox = yes
  separator = .
  prefix =
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = create
  }
  mailbox Archive {
    special_use = \Archive
  }
}
